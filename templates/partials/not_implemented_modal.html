{# Shared Carbon modal for features out of prototype scope. #}
{# Trigger: any element with data-not-implemented="<feature>" (value documents the feature in source only). #}
<div class="cds--modal" id="not-implemented-modal" role="presentation" data-modal>
  <div class="cds--modal-container cds--modal-container--xs" role="dialog" aria-modal="true" aria-labelledby="not-implemented-title" tabindex="-1">
    <div class="cds--modal-header">
      <h2 class="cds--modal-header__heading" id="not-implemented-title">Notimplemented</h2>
      <div class="cds--modal-close-button">
        <button type="button" class="cds--modal-close" aria-label="Uždaryti" data-modal-close>
          {% include "icons/close.svg" with cls="cds--modal-close__icon" %}
        </button>
      </div>
    </div>
  </div>
</div>
