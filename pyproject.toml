[project]
name = "autoservisu-sistema"
version = "0.0.1"
description = "auto service system"
readme = "README.md"
authors = [
    { name = "Ahrirg", email = "ldargevicius20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-tailwind>=4.6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "autoservisu_sistema.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF012: Django Meta / migration class attributes are idiomatic mutables
ignore = ["RUF012"]
