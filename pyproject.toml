[project]
name = "autoservisu-sistema"
version = "0.0.1"
description = "auto service system"
readme = "README.md"
authors = [
    { name = "Ahrirg", email = "ldargevicius20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
]

[project.scripts]
autoservisu-sistema = "autoservisu_sistema:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
    "ty>=0.0.93",
]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "autoservisu_sistema.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
